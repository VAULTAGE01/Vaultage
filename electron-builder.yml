appId: xyz.arcalab.vaultage.community
productName: Vaultage Community
artifactName: Vaultage-Community-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: arcalab-xyz
  repo: Vaultage

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - "!**/*.map"

# ── macOS ──────────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  extraResources:
    - from: resources/vault-keychain
      to: Vaultage Community Keychain
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal

dmg:
  sign: false
  title: Vaultage Community

# ── Windows ────────────────────────────────────────────────────────────────────
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  shortcutName: Vaultage Community
