# Keep build tooling on patched transitive versions until electron-builder and
# the Vite toolchain raise their own minimums. `pnpm audit` remains a hard gate.
overrides:
  '@babel/core': 7.29.7
  baseline-browser-mapping: 2.10.42
  'brace-expansion@>=1.0.0 <6.0.0': 5.0.9
  electron-builder-squirrel-windows: 26.15.6
  esbuild: 0.28.1
  fast-uri: 3.1.5
  form-data: 4.0.6
  js-yaml: 4.3.0
  tar: 7.5.21
  tmp: 0.2.7
  undici: 6.28.0

engineStrict: true

allowBuilds:
  electron: true
  esbuild: true
  # Windows packaging is intentionally unsupported; its installer helper must
  # remain present only as electron-builder metadata and never execute here.
  electron-winstaller: false

# These exact security patches are newer than the workspace's dependency-age
# policy. Keep the exception bounded to the reviewed patched versions.
minimumReleaseAgeExclude:
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - undici@6.28.0
