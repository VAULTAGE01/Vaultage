# Keep build tooling on patched transitive versions until electron-builder and
# the Vite toolchain raise their own minimums. `pnpm audit` remains a hard gate.
overrides:
  '@babel/core': 7.29.7
  baseline-browser-mapping: 2.10.42
  electron-builder-squirrel-windows: 26.15.6
  esbuild: 0.28.1
  form-data: 4.0.6
  js-yaml: 4.3.0
  tar: 7.5.19
  tmp: 0.2.7
  undici: 6.27.0

engineStrict: true

allowBuilds:
  electron: true
  esbuild: true
  # Windows packaging is intentionally unsupported; its installer helper must
  # remain present only as electron-builder metadata and never execute here.
  electron-winstaller: false
