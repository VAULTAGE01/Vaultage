name: Community macOS release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed 40-character Community commit at current main
        required: true
        type: string
      release_tag:
        description: Existing tag matching package.json (for example v0.1.3)
        required: true
        type: string
      release_mode:
        description: Signed evaluation skips notarization; notarized requires Apple account credentials
        required: true
        default: signed-evaluation
        type: choice
        options:
          - signed-evaluation
          - notarized

permissions:
  contents: read

concurrency:
  group: community-release
  cancel-in-progress: false

jobs:
  prepare-community-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact reviewed Community main and tag candidate
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REPOSITORY" = "VAULTAGE01/Vaultage"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          test "${#RELEASE_COMMIT}" -eq 40
          case "$RELEASE_COMMIT" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --force origin refs/heads/main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          case "$RELEASE_MODE" in
            signed-evaluation|notarized) ;;
            *) exit 1 ;;
          esac
          test -z "$(git status --porcelain)"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      - name: Install Community dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Community source on Linux
        run: pnpm verify:release

  build-sign-and-accept-community-macos:
    needs: [prepare-community-source]
    runs-on: macos-14
    timeout-minutes: 45
    environment: community-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      - name: Recheck the exact Community main and tag candidate before signing
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REPOSITORY" = "VAULTAGE01/Vaultage"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          test "${#RELEASE_COMMIT}" -eq 40
          case "$RELEASE_COMMIT" in
            *[!0-9a-f]*) exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --force origin refs/heads/main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          case "$RELEASE_MODE" in
            signed-evaluation|notarized) ;;
            *) exit 1 ;;
          esac

      - name: Install Community dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sign the universal Community app and DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          test -n "$APPLE_TEAM_ID"
          test -n "$CSC_NAME"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          case "$RELEASE_MODE" in
            signed-evaluation)
              BUILDER_CONFIG=electron-builder.signed-evaluation.yml
              ;;
            notarized)
              test -n "$APPLE_ID"
              test -n "$APPLE_APP_SPECIFIC_PASSWORD"
              BUILDER_CONFIG=electron-builder.release.yml
              ;;
            *) exit 1 ;;
          esac
          pnpm build:open-local
          pnpm exec electron-builder --config "$BUILDER_CONFIG" --mac --universal

      - name: Label signed evaluation DMG as not notarized
        if: ${{ inputs.release_mode == 'signed-evaluation' }}
        run: |
          DMG="$(node scripts/select-exact-release-dmg.mjs dist)"
          LABELED_DMG="${DMG%.dmg}-SIGNED-EVALUATION-NOT-NOTARIZED.dmg"
          test "$LABELED_DMG" != "$DMG"
          mv "$DMG" "$LABELED_DMG"

      - name: Notarize and staple the exact Community DMG
        if: ${{ inputs.release_mode == 'notarized' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="$(node scripts/select-exact-release-dmg.mjs dist)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Record the exact built Community artifact
        run: |
          DMG="$(node scripts/select-exact-release-dmg.mjs dist)"
          node scripts/record-packaged-mac-artifact.mjs \
            --app dist/mac-universal/vault-OC.app \
            --dmg "$DMG" \
            --out dist/packaged-mac-artifact-record.json

      - name: Verify packaged Community signature, entitlements, and launch
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          APP=dist/mac-universal/vault-OC.app
          codesign --verify --deep --strict "$APP"
          FRAMEWORK="$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          test "$(lipo -archs "$FRAMEWORK" | tr ' ' '\n' | sort | tr '\n' ' ')" = 'arm64 x86_64 '
          case "$RELEASE_MODE" in
            notarized)
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose "$APP"
              ;;
            signed-evaluation) ;;
            *) exit 1 ;;
          esac
          pnpm smoke:mac-entitlements -- "$APP"
          pnpm smoke:packaged-app -- "$APP"

      - name: Generate Community CycloneDX SBOMs
        run: pnpm sbom:generate

      - name: Generate packaged Community app CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: dist/mac-universal/vault-OC.app
          format: cyclonedx-json
          output-file: dist/vaultage-artifact.cdx.json
          artifact-name: community-packaged-app-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Retain the signed Community candidate briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: community-mac-release-${{ inputs.release_mode }}-${{ inputs.release_commit }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.cdx.json
            dist/packaged-mac-artifact-record.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: community-mac-release-${{ inputs.release_mode }}-${{ inputs.release_commit }}
          path: downloaded-community-release

      - name: Mount and accept the exact downloaded Community DMG
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          DMG="$(node scripts/select-exact-release-dmg.mjs downloaded-community-release \
            --artifact-record downloaded-community-release/packaged-mac-artifact-record.json)"
          case "$RELEASE_MODE" in
            notarized)
              xcrun stapler validate "$DMG"
              spctl --assess --type open --context context:primary-signature --verbose "$DMG"
              ;;
            signed-evaluation)
              case "$(basename "$DMG")" in
                *-SIGNED-EVALUATION-NOT-NOTARIZED.dmg) ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          MOUNT="$RUNNER_TEMP/vaultage-community-downloaded-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT"' EXIT
          APP="$MOUNT/vault-OC.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          FRAMEWORK="$APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          test "$(lipo -archs "$FRAMEWORK" | tr ' ' '\n' | sort | tr '\n' ' ')" = 'arm64 x86_64 '
          if [ "$RELEASE_MODE" = notarized ]; then
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose "$APP"
          fi
          pnpm smoke:mac-entitlements -- "$APP"
          pnpm smoke:packaged-app -- "$APP"
          node --input-type=module - "$APP" "$DMG" \
            downloaded-community-release/packaged-mac-artifact-record.json \
            downloaded-community-release/community-dmg-acceptance.json <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { basename } from 'node:path'
          import { digest, digestAppBundle } from './scripts/mac-artifact-digest-lib.mjs'

          const [app, dmg, recordPath, output] = process.argv.slice(2)
          const recordBytes = readFileSync(recordPath)
          const record = JSON.parse(recordBytes)
          const appSha256 = digestAppBundle(app)
          const dmgSha256 = digest(readFileSync(dmg))
          if (
            record?.schemaVersion !== 1
            || record?.kind !== 'vaultage-packaged-mac-artifact-record-v1'
            || record.dmgName !== basename(dmg)
            || record.appSha256 !== appSha256
            || record.dmgSha256 !== dmgSha256
          ) throw new Error('downloaded Community DMG does not match the signed build record')
          writeFileSync(output, `${JSON.stringify({
            schemaVersion: 1,
            kind: 'vaultage-downloaded-mac-artifact-acceptance-v1',
            releaseCommit: process.env.RELEASE_COMMIT,
            releaseMode: process.env.RELEASE_MODE,
            releaseTag: process.env.RELEASE_TAG,
            notarized: process.env.RELEASE_MODE === 'notarized',
            dmgName: record.dmgName,
            dmgSha256,
            appSha256,
            buildArtifactRecordSha256: digest(recordBytes),
          }, null, 2)}\n`, { flag: 'wx', mode: 0o600 })
          NODE

      - name: Retain the downloaded-DMG acceptance receipt briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: community-mac-release-acceptance-${{ inputs.release_mode }}-${{ inputs.release_commit }}
          retention-days: 3
          if-no-files-found: error
          path: downloaded-community-release/community-dmg-acceptance.json

  publish-community-release:
    needs: [build-sign-and-accept-community-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Recheck the exact Community tag before publication
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REPOSITORY" = "VAULTAGE01/Vaultage"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --force origin refs/heads/main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          case "$RELEASE_MODE" in
            signed-evaluation|notarized) ;;
            *) exit 1 ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: community-mac-release-${{ inputs.release_mode }}-${{ inputs.release_commit }}
          path: artifacts/community-mac-release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: community-mac-release-acceptance-${{ inputs.release_mode }}-${{ inputs.release_commit }}
          path: artifacts/community-mac-release-acceptance

      - name: Stage exact accepted Community release assets
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          DMG="$(node scripts/select-exact-release-dmg.mjs artifacts/community-mac-release \
            --artifact-record artifacts/community-mac-release/packaged-mac-artifact-record.json \
            --acceptance-receipt artifacts/community-mac-release-acceptance/community-dmg-acceptance.json)"
          node --input-type=module - \
            artifacts/community-mac-release/packaged-mac-artifact-record.json \
            artifacts/community-mac-release-acceptance/community-dmg-acceptance.json <<'NODE'
          import { readFileSync } from 'node:fs'
          import { digest } from './scripts/mac-artifact-digest-lib.mjs'

          const [recordPath, acceptancePath] = process.argv.slice(2)
          const recordBytes = readFileSync(recordPath)
          const record = JSON.parse(recordBytes)
          const acceptance = JSON.parse(readFileSync(acceptancePath))
          if (
            acceptance.releaseCommit !== process.env.RELEASE_COMMIT
            || acceptance.releaseMode !== process.env.RELEASE_MODE
            || acceptance.releaseTag !== process.env.RELEASE_TAG
            || acceptance.notarized !== (process.env.RELEASE_MODE === 'notarized')
            || acceptance.buildArtifactRecordSha256 !== digest(recordBytes)
            || acceptance.dmgSha256 !== record.dmgSha256
            || acceptance.appSha256 !== record.appSha256
          ) throw new Error('Community release assets do not match the protected acceptance receipt')
          if (
            process.env.RELEASE_MODE === 'signed-evaluation'
            && !record.dmgName.endsWith('-SIGNED-EVALUATION-NOT-NOTARIZED.dmg')
          ) throw new Error('signed evaluation DMG is missing its NOT NOTARIZED filename warning')
          NODE
          mkdir release-assets
          cp "$DMG" release-assets/
          cp artifacts/community-mac-release/*.cdx.json release-assets/
          cp artifacts/community-mac-release/packaged-mac-artifact-record.json release-assets/
          cp artifacts/community-mac-release-acceptance/community-dmg-acceptance.json release-assets/
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Attest the exact Community DMG provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: release-assets/*.dmg

      - name: Create the Community prerelease with the same-repository token
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$GH_TOKEN"
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          case "$RELEASE_MODE" in
            signed-evaluation)
              RELEASE_TITLE="Vaultage Community $RELEASE_TAG — SIGNED EVALUATION — NOT NOTARIZED"
              RELEASE_WARNING="SIGNED EVALUATION PRERELEASE — NOT NOTARIZED and not production-ready. macOS may require right-click Open on first launch."
              ;;
            notarized)
              RELEASE_TITLE="Vaultage Community $RELEASE_TAG — NOTARIZED PRERELEASE"
              RELEASE_WARNING="Signed and notarized Community prerelease. This prerelease is not production-ready."
              ;;
            *) exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_WARNING" \
            --generate-notes \
            release-assets/*
